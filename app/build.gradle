plugins { id 'com.android.application' }

android {
    namespace 'com.dsh.whalefloat'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsh.whalefloat"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用你的密钥签名后即可安装；debug 构建可直接用 Android Studio 运行
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
