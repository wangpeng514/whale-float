plugins { id 'com.android.application' }

android {
    namespace 'com.dsh.whalefloat'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsh.whalefloat"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用你的密钥签名后即可安装；debug 构建可直接用 Android Studio 运行
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 不引入任何第三方依赖：纯 Java + 系统原生控件。
// （appcompat 会拉入 kotlin-stdlib，与 kotlin-stdlib-jdk7/jdk8 产生 Duplicate class 编译错误）
dependencies { }
